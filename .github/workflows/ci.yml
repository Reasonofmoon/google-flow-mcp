name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }}, mcp ${{ matrix.mcp }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        mcp: ["<2", ">=2,<3"]
        include:
          # the same checks where most desktop MCP clients actually run
          - os: windows-latest
            python-version: "3.12"
            mcp: ">=2,<3"
          - os: macos-latest
            python-version: "3.12"
            mcp: ">=2,<3"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install package with dev dependencies
        run: uv pip install --system -e ".[dev]" "mcp[cli]${{ matrix.mcp }}"

      - name: Show versions
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'), '| google-genai', m.version('google-genai')); from google_flow_mcp import media; print('ffmpeg', media.ffmpeg_exe())"

      - name: Run tests
        run: pytest -v --tb=short tests/

      - name: Offline demo film (no API key)
        if: matrix.python-version == '3.12' && matrix.mcp == '>=2,<3'
        run: python examples/offline_demo.py demo_output

      - name: MCP smoke test over stdio (demo mode, then no key)
        run: python examples/mcp_smoke_test.py smoke_output

      - name: Upload demo project
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.mcp == '>=2,<3'
        uses: actions/upload-artifact@v4
        with:
          name: offline-demo
          path: demo_output
          retention-days: 14

      - name: Server starts and lists tools
        run: |
          python - <<'EOF'
          import asyncio
          from google_flow_mcp.server import mcp
          tools = asyncio.run(mcp.list_tools())
          names = sorted(t.name for t in tools)
          print(len(names), names)
          assert len(names) == 21, names
          prompts = sorted(p.name for p in asyncio.run(mcp.list_prompts()))
          print(prompts)
          assert prompts == ['product_ad', 'short_film', 'social_image_set'], prompts
          EOF
