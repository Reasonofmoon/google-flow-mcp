name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, mcp ${{ matrix.mcp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        mcp: ["<2", ">=2,<3"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install package with dev dependencies
        run: uv pip install --system -e ".[dev]" "mcp[cli]${{ matrix.mcp }}"

      - name: Show versions
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'), '| google-genai', m.version('google-genai'))"

      - name: Run tests
        run: pytest -v --tb=short tests/

      - name: Server starts and lists tools
        run: |
          python - <<'EOF'
          import asyncio
          from google_flow_mcp.server import mcp
          tools = asyncio.run(mcp.list_tools())
          names = sorted(t.name for t in tools)
          print(len(names), names)
          assert len(names) == 9, names
          EOF
