[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-flow-mcp"
version = "0.1.0"
description = "MCP server giving Claude Desktop access to Google AI image and video generation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["mcp", "google-ai", "imagen", "veo", "claude", "image-generation", "video-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2",  # 0.1.0 uses mcp.server.fastmcp, removed in mcp 2.x
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
google-flow-mcp = "google_flow_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Reasonofmoon/google-flow-mcp"
Issues = "https://github.com/Reasonofmoon/google-flow-mcp/issues"
Upstream = "https://pypi.org/project/google-flow-mcp/"

[tool.hatch.build.targets.wheel]
packages = ["src/google_flow_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
